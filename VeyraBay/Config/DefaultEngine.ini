; ---------------------------------------------------------------------------
; Veyra Bay - Engine-Konfiguration
; Vollstaendig dynamische Beleuchtung (Tag/Nacht), Lumen, Nanite, VSM, HW-RT.
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/VeyraBay/World/Maps/L_VB_Dev.L_VB_Dev
GameDefaultMap=/Game/VeyraBay/World/Maps/L_VB_Dev.L_VB_Dev
GlobalDefaultGameMode=/Script/VeyraBay.VBGameMode

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Globale Beleuchtung & Reflexionen: Lumen ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
; --- Hardware Ray Tracing (RTX 4090) - wird vom Grafikmodus zur Laufzeit genutzt ---
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
r.SkinCache.CompileShaders=True
; --- Schatten: Virtual Shadow Maps ---
r.Shadow.Virtual.Enable=1
; --- Nanite ---
r.Nanite.ProjectEnabled=True
; --- Keine statische Beleuchtung: alles dynamisch (24h-Zyklus) ---
r.AllowStaticLighting=False
; --- Anti-Aliasing / Upscaling: Temporal Super Resolution ---
r.AntiAliasingMethod=4
; --- Physikalisch basierte Belichtung (Sonne in Lux) ---
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
; --- Texturen / Streaming ---
r.VirtualTextures=True
r.VirtualTexturedLightmaps=False
; --- Sonstiges ---
r.CustomDepth=3
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.Shaders.Optimize=1

[/Script/Engine.Engine]
NearClipPlane=5.0

[/Script/VBWorld.VBWorldDeveloperSettings]
WorldParameterCollection=/Game/VeyraBay/Materials/Global/MPC_VB_World.MPC_VB_World
RealMinutesPerGameDay=48.0
StartTimeOfDay=9.0
StartDayOfYear=196
Latitude=34.0
NorthYawOffset=0.0
StartWeather=Clear
DefaultWeatherTransitionSeconds=45.0
bDynamicWeather=True
DynamicWeatherIntervalMinutes=(X=6.0,Y=14.0)
